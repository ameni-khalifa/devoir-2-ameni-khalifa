
<div class="container">

  <div>
    <h2>Ajouter un Produit</h2>
  </div>

  <form>

    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>ID Produit</label>

      <input
        type="text"
        [(ngModel)]="newproduit.idproduit"
        name="idproduit"
        class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Nom Produit</label>

      <input
        type="text"
        [(ngModel)]="newproduit.nomproduit"
        name="nomproduit"
        class="form-control">
    </div>

    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Prix Produit</label>

      <input
        type="number"
        [(ngModel)]="newproduit.prixproduit"
        name="prixproduit"
        class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date création</label>

      <input
        type="date"
        [(ngModel)]="newproduit.datecreation"
        name="datecreation"
        class="form-control">
    </div>

    <div class="mt-2">

      <button
        type="button"
        class="btn btn-success"
        (click)="addproduit()">
        Ajouter Produit
      </button>

    </div>

  </form>

  @if (message) {
    <p>{{ message }}</p>
  }

</div>
